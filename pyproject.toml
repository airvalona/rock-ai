[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rock-ai"
version = "0.1.0"
description = "Autonomous 24/7 persistent multi-agent fleet with interactive terminal setup and visual workspace."
readme = "README.md"
authors = [
    { name = "airvalona" }
]
license = { text = "MIT" }
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/airvalona/rock-ai"
Repository = "https://github.com/airvalona/rock-ai"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "inquirerpy>=0.3.4",
    "litellm>=1.40.0",
    "pydantic>=2.7.0",
    "sqlmodel>=0.0.18",
    "apscheduler>=3.10.4",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "python-telegram-bot>=21.0.0",
    "duckduckgo-search>=5.3.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
rock = "rock.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["rock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
